<style>
  :root{
    --ink:#e9eff9;
    --dim:#8d9cb5;
    --gold:#ffc75f;
    --cyan:#7fd0ff;
    --line:rgba(255,255,255,.09);
    --glass:rgba(16,24,40,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#03050c;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;

    user-select:none;
    overscroll-behavior:none;
  }
  #sky{position:fixed;inset:0;display:block}

  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:24px 28px 22px}

  /* ---------- 顶部 ---------- */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}

    padding:3px 10px 3px 4px;border-radius:20px;

    position:fixed;left:50%;bottom:7px;transform:translateX(-50%);z-index:2;

  .panel{

  svg.chart{display:block;width:100%;height:74px;margin-top:6px;overflow:visible}

  .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  .speedwrap{display:flex;align-items:center;gap:8px;padding:0 6px 0 2px}
  .speedwrap span{font-size:10.5px;color:var(--dim);letter-spacing:.1em}
  .speedwrap .val{color:#cfe0f6;min-width:30px;font-variant-numeric:tabular-nums}

  input[type=range]{
    -webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:rgba(255,255,255,.16);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{

    box-shadow:0 0 10px rgba(127,208,255,.85);cursor:pointer;

  #speed{width:78px}
  #latSlider{flex:1}


  @media (max-width:820px){
    .ui{padding:14px 12px 12px}
    .top{flex-direction:column;align-items:stretch;gap:9px}

    .readout{width:100%;padding:11px 13px 10px}
    .dateLine{gap:6px}
    #dateTxt{font-size:21px}
    #seasonTag{font-size:9px;padding:3px 7px}
    .rows{margin-top:8px;padding-top:7px;grid-template-columns:1fr 1fr;display:grid;gap:5px 14px}
    .row{font-size:10px}
    .declbar{margin-top:9px}

    .bottom{flex-direction:column;align-items:stretch;gap:9px}
    .chartcard{width:100%;padding:10px 12px 9px}
    svg.chart{height:52px}
    .latrow{margin-top:6px}
    .dock{justify-content:space-between;gap:5px;padding:7px 8px}
    .btn{min-width:0;padding:0 9px;height:31px;font-size:11px;letter-spacing:.04em}
    .speedwrap{display:none}

  @media (max-width:820px) and (max-height:700px){
    .chartcard{display:none}

  @media (max-height:620px){
    .chartcard{display:none}

</style>

<body>
<canvas id="sky"></canvas>

<div class="ui">
  <div class="top">
    <div class="brand">
      <h1>地球的公转与四季</h1>
      <p>黄赤交角 <em>23.44°</em> · 地轴指向恒定 · 点击节气可跳转</p>
      <div class="credit"><span class="seal">倪</span><span class="txt"><b>倪神肥鱼</b> 出品</span></div>
    </div>

    <div class="panel readout">
      <div class="dateLine">
        <div id="dateTxt">3月20日</div>
        <div id="seasonTag">北半球 春季</div>
      </div>
      <div class="rows">
        <div class="row"><span class="k">南半球</span><span class="v" id="southSeason">秋季</span></div>
        <div class="row"><span class="k">太阳直射点</span><span class="v" id="declTxt">赤道</span></div>
        <div class="row"><span class="k">直射点动向</span><span class="v" id="progTxt">北移 ↑</span></div>
      </div>
      <div class="declbar"><div id="declDot"></div></div>

  </div>

  <div class="bottom">
    <div class="panel chartcard">
      <div class="ctitle">
        <span>昼长变化 · <b id="latLabel">北纬 40°</b></span>

      </div>
      <svg class="chart" id="chartSvg"></svg>

    </div>
  </div>
</div>

<div class="wm">倪神肥鱼 出品 · NISHEN FEIYU</div>

<script>
(function(){
"use strict";

/* =========================================================
   基础常量
   ========================================================= */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const TILT = 23.44 * DEG;          // 黄赤交角
let EL     = 30 * DEG;             // 视角仰角（决定轨道椭圆扁度）

const sinT = Math.sin(TILT), cosT = Math.cos(TILT);
let sinEl = Math.sin(EL),  cosEl = Math.cos(EL);

// 相机基向量（正交投影）
// 地轴方向：始终指向同一个天区（不随公转改变）——这是四季的根源
const AXIS  = [sinT, cosT, 0];
const E1    = [cosT, -sinT, 0];     // 与地轴垂直，本初子午线方向

let SRC = null;
const TW = 1024, TH = 512;      // 贴图绘制分辨率
const STW = 512, STH = 256;     // 采样分辨率（下采样后，抑制摩尔纹）
let TEX = null;

/* =========================================================
   状态
   ========================================================= */
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, scale = 400, R = 64;
let theta = Math.PI / 2;      // 0 = 冬至，π/2 = 春分，π = 夏至，3π/2 = 秋分
let spin = 0;                 // 地球自转纹理偏移
let playing = true;
let speed = 1;
let latView = 40;
let tween = null;
let last = performance.now();
let hudAt = 0;

const ORBIT_SEC  = 58;        // 1× 速度下一圈公转耗时（秒）
const SPINS_PER_ORBIT = 12;   // 每圈自转的示意次数（非真实比例）

const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');

/* =========================================================
   地球贴图：等距圆柱投影 + 手绘大陆轮廓
   ========================================================= */
function buildTexture(){
  const c = document.createElement('canvas');
  c.width = TW; c.height = TH;
  const g = c.getContext('2d');

  // 海洋
  const og = g.createLinearGradient(0, 0, 0, TH);
  og.addColorStop(0.00, '#0a2c4d');
  og.addColorStop(0.28, '#0e4a78');
  og.addColorStop(0.50, '#12628f');
  og.addColorStop(0.72, '#0e4a78');
  og.addColorStop(1.00, '#0a2c4d');
  g.fillStyle = og; g.fillRect(0, 0, TW, TH);

  // 海洋纹理
  for(let i = 0; i < 520; i++){
    const x = Math.random() * TW, y = Math.random() * TH, r = 12 + Math.random() * 90;
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(120,205,255,' + (0.012 + Math.random() * 0.03).toFixed(3) + ')');
    rg.addColorStop(1, 'rgba(120,205,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

  const P = (lon, lat) => [ (lon + 180) / 360 * TW, (90 - lat) / 180 * TH ];

  const NA = [-168,65,-164,69,-155,71,-140,70,-128,70,-115,69,-100,69,-85,70,-78,73,-70,68,-62,60,-55,52,-60,47,-66,45,-70,42,-74,39,-76,35,-81,31,-80,26,-84,30,-88,30,-94,29,-97,26,-104,20,-110,24,-114,28,-117,32,-122,37,-124,42,-124,48,-128,52,-135,57,-145,60,-152,58,-160,56,-165,60];
  const SA = [-81,8,-75,11,-66,11,-60,8,-52,5,-45,-2,-38,-6,-35,-8,-39,-14,-44,-23,-48,-25,-54,-34,-58,-38,-62,-41,-66,-45,-68,-52,-72,-54,-75,-50,-74,-44,-73,-37,-71,-30,-70,-23,-70,-18,-76,-14,-79,-8,-81,-5];
  const AF = [-17,21,-16,15,-13,10,-8,5,0,5,6,4,9,4,9,-1,12,-6,13,-12,12,-17,15,-23,18,-29,20,-34,26,-34,32,-29,35,-24,40,-16,41,-11,40,-3,43,4,51,11,43,12,38,17,35,22,33,28,32,31,25,32,18,31,10,34,3,36,-6,36,-10,31,-13,27];
  const EU = [-9,43,-9,38,-6,36,0,39,3,42,7,44,12,45,12,38,16,40,20,40,24,40,28,41,27,37,30,36,35,36,36,31,34,28,38,26,43,13,48,15,52,26,56,25,60,25,63,22,67,24,72,20,77,8,80,10,87,21,89,22,93,17,98,10,103,2,105,10,108,15,110,21,117,23,122,30,122,38,127,38,129,43,135,48,140,52,145,58,155,60,160,60,168,66,180,66,180,70,160,70,140,72,120,74,100,78,80,74,60,70,45,68,30,70,20,70,15,68,12,65,8,58,5,54,2,51,-2,49];
  const AU = [113,-22,114,-33,118,-35,129,-32,135,-35,140,-38,147,-38,153,-28,153,-25,146,-19,142,-11,136,-12,130,-11,125,-14,121,-19];

  const landShot = new Path2D();
  function addPoly(arr, path){
    for(let i = 0; i < arr.length; i += 2){
      const [x, y] = P(arr[i], arr[i+1]);
      i === 0 ? path.moveTo(x, y) : path.lineTo(x, y);
    }
    path.closePath();
  }
  [NA, SA, AF, EU, AU].forEach(a => addPoly(a, landShot));

  // 小块陆地块
  const blobs = [[-3,54,9,12],[139,37,5,9],[47,-20,4,7],[172,-42,4,8],[113,-1,16,6],[123,12,5,6],[80,22,9,10],[-62,18,8,3],[-45,72,22,15],[-20,79,14,8]];
  blobs.forEach(([lo, la, w, h]) => {
    const [x, y] = P(lo, la);
    const rx = w / 360 * TW, ry = h / 180 * TH;
    landShot.moveTo(x + rx, y);   // 避免与上一个子路径连成直线
    landShot.ellipse(x, y, rx, ry, 0, 0, TAU);
  });

  // 陆地填色
  g.save(); g.clip(landShot);
  g.fillStyle = '#3f6a49'; g.fillRect(0, 0, TW, TH);
  for(let i = 0; i < 620; i++){
    const x = Math.random() * TW, y = Math.random() * TH, r = 8 + Math.random() * 46;
    const pick = Math.random();
    const col = pick < 0.32 ? '190,168,110' : pick < 0.62 ? '86,126,80' : pick < 0.85 ? '58,92,66' : '120,142,96';
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(' + col + ',' + (0.18 + Math.random() * 0.3).toFixed(2) + ')');
    rg.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // 极地苔原泛白
  const tg = g.createLinearGradient(0, 0, 0, TH);
  tg.addColorStop(0, 'rgba(228,242,255,.85)');
  tg.addColorStop(0.13, 'rgba(228,242,255,0)');
  tg.addColorStop(0.87, 'rgba(228,242,255,0)');
  tg.addColorStop(1, 'rgba(228,242,255,.95)');
  g.fillStyle = tg; g.fillRect(0, 0, TW, TH);
  g.restore();

  // 经线（让自转可见）
  g.save(); g.globalCompositeOperation = 'lighter';
  g.strokeStyle = 'rgba(180,220,255,.055)'; g.lineWidth = 3;
  for(let lo = -180; lo < 180; lo += 30){
    const x = (lo + 180) / 360 * TW;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, TH); g.stroke();
  }
  g.strokeStyle = 'rgba(180,220,255,.045)';
  for(let la = -60; la <= 60; la += 30){
    const y = (90 - la) / 180 * TH;
    g.beginPath(); g.moveTo(0, y); g.lineTo(TW, y); g.stroke();
  }
  g.restore();

  // 极冠
  const cap = (from, to, h) => {
    const gr = g.createLinearGradient(0, from, 0, to);
    gr.addColorStop(0, 'rgba(250,253,255,.96)');
    gr.addColorStop(0.55, 'rgba(238,248,255,.55)');
    gr.addColorStop(1, 'rgba(238,248,255,0)');
    g.fillStyle = gr; g.fillRect(0, Math.min(from, to), TW, Math.abs(to - from));
  };
  cap(0, TH * (90 - 71) / 180);
  cap(TH, TH - TH * (90 - 71) / 180);

  SRC = c;

  // 下采样：把高频细节抹平，避免球面点采样出现摩尔纹
  const sm = document.createElement('canvas');
  sm.width = STW; sm.height = STH;
  const sg = sm.getContext('2d');
  sg.imageSmoothingEnabled = true;
  sg.imageSmoothingQuality = 'high';
  sg.drawImage(c, 0, 0, STW, STH);
  TEX = sg.getImageData(0, 0, STW, STH).data;
}

/* =========================================================
   球面像素预计算（正交投影：法线只算一次）
   ========================================================= */
let G = null;
function buildGlobe(){
  const rDev = R * DPR;
  const size = Math.round(rDev * 2);
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  const img = octx.createImageData(size, size);

  const N = size * size;
  const nx = new Float32Array(N), ny = new Float32Array(N), nz = new Float32Array(N);
  const lob = new Float32Array(N), rowA = new Int32Array(N);
  const wA = new Float32Array(N), alA = new Uint8Array(N);
  const c0 = size / 2;

  for(let py = 0; py < size; py++){
    const dy = (py + 0.5 - c0) / rDev;
    for(let px = 0; px < size; px++){
      const dx = (px + 0.5 - c0) / rDev;
      const i = py * size + px;
      const rho2 = dx * dx + dy * dy;
      if(rho2 > 1 + 1.8 / rDev){ alA[i] = 0; continue; }

      const rho = Math.sqrt(rho2);
      let vx = dx, vy = -dy, vz = rho < 1 ? Math.sqrt(1 - rho2) : 0;
      if(rho >= 1){ vx = dx / rho; vy = -dy / rho; vz = 0; }

      // 世界法线
      const wx = vx;
      const wy = vy * cosEl + vz * sinEl;
      const wz = -vy * sinEl + vz * cosEl;
      nx[i] = wx; ny[i] = wy; nz[i] = wz;

      // 行星坐标系（绕地轴）
      const pAxis = wx * sinT + wy * cosT;
      const pE1   = wx * cosT - wy * sinT;
      const pZ    = wz;

      const lat = Math.asin(Math.max(-1, Math.min(1, pAxis)));
      const lon = Math.atan2(pZ, pE1);

      let v = 0.5 - lat / Math.PI;
      v = Math.min(0.999, Math.max(0, v));
      rowA[i] = Math.floor(v * STH) * STW * 4;   // 字节偏移
      lob[i] = lon / TAU + 0.5;
      wA[i] = vz;

      let a = (1 - rho) * rDev + 0.5;
      a = a < 0 ? 0 : a > 1 ? 1 : a;
      alA[i] = (a * 255) | 0;
    }
  }

  G = { off, octx, img, size, N, nx, ny, nz, lob, rowA, wA, alA,
        dst: size / DPR };
}

/* 逐像素着色 */
function renderGlobe(ex, ey, Lx, Ly, Lz, rotN){
  if(!G) return;
  const { img, size, nx, ny, nz, lob, rowA, wA, alA, N } = G;
  const d = img.data;
  const tex = TEX;

  for(let i = 0; i < N; i++){
    const a = alA[i];
    if(!a) continue;

    // 光照
    let lit = nx[i] * Lx + ny[i] * Ly + nz[i] * Lz;
    let t = (lit + 0.055) / 0.17;
    if(t < 0) t = 0; else if(t > 1) t = 1;
    t = t * t * (3 - 2 * t);
    const sh = 0.075 + 0.925 * t;

    // 采样贴图
    let u = lob[i] - rotN;
    u -= Math.floor(u);
    let col = (u * STW) | 0;
    if(col >= STW) col = STW - 1;
    const ti = rowA[i] + col * 4;
    let r = tex[ti] * sh, gg = tex[ti + 1] * sh, bb = tex[ti + 2] * sh;

    // 边缘大气辉光
    const limb = 1 - wA[i];
    if(limb > 0.55){
      const f = (limb - 0.55) / 0.45;
      const k = f * f * f * 92 * (0.25 + 0.75 * t);
      r += k * 0.32; gg += k * 0.72; bb += k * 1.05;
    }

    const o = i * 4;
    d[o]     = r  > 255 ? 255 : r;
    d[o + 1] = gg > 255 ? 255 : gg;
    d[o + 2] = bb > 255 ? 255 : bb;
    d[o + 3] = a;
  }

  G.octx.putImageData(img, 0, 0);
  const s = G.dst;
  ctx.drawImage(G.off, ex - s / 2, ey - s / 2, s, s);
}

/* =========================================================
   星空
   ========================================================= */
let stars = [];
function buildStars(){
  stars = [];
  const n = Math.min(420, Math.round(W * H / 7600));
  for(let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.25 + 0.25,
      a: Math.random() * 0.55 + 0.15,
      p: Math.random() * TAU,
      s: 0.4 + Math.random() * 1.6
    });
  }
}

let bgGrad = null;
function buildBG(){
  bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.85);
  bgGrad.addColorStop(0, '#070d1b');
  bgGrad.addColorStop(0.45, '#04070f');
  bgGrad.addColorStop(1, '#010206');
}

function drawSky(time){
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 淡淡的星云
  let g = ctx.createRadialGradient(W * 0.18, H * 0.16, 0, W * 0.18, H * 0.16, W * 0.45);
  g.addColorStop(0, 'rgba(70,60,150,.055)');
  g.addColorStop(1, 'rgba(70,60,150,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  g = ctx.createRadialGradient(W * 0.84, H * 0.86, 0, W * 0.84, H * 0.86, W * 0.4);
  g.addColorStop(0, 'rgba(30,90,140,.05)');
  g.addColorStop(1, 'rgba(30,90,140,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for(let i = 0; i < stars.length; i++){
    const s = stars[i];
    const a = s.a * (0.62 + 0.38 * Math.sin(time * s.s + s.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dceaff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let TAFFY = null, TAFFY_READY = false, TAFFY_CROP = null;
let RAYS = null, RAYS_WIDE = null;

function initTaffy(){
  const im = new Image();
  im.onload = function(){
    // 底部对齐裁切：这个角色的刘海占了大半个头，按几何中心裁会把嘴切掉
    const side = Math.min(im.width, im.height) * 0.87;
    TAFFY_CROP = {
      x: (im.width - side) / 2,
      y: Math.max(0, im.height - side),
      s: side
    };
    TAFFY = im;
    TAFFY_READY = true;
  };
  im.onerror = function(){ TAFFY_READY = false; };
  im.src = TAFFY_SRC;
}

/* 光芒预渲染：每帧只 drawImage，避免几十个渐变把帧率拖死 */
function makeRaySprite(count, lenRatio, halfBase, alpha){
  const S = 512, C = S / 2;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  // 模糊掉楔形的硬边，否则每条光都像剪纸
  if('filter' in g) g.filter = 'blur(' + (S * 0.013).toFixed(1) + 'px)';
  for(let i = 0; i < count; i++){
    const a = i / count * TAU;
    const len = C * lenRatio;
    const half = halfBase + (i % 3) * 0.008;
    g.save();
    g.translate(C, C);
    g.beginPath();
    g.moveTo(0, 0);
    g.arc(0, 0, len, a - half, a + half);
    g.closePath();
    const gr = g.createRadialGradient(0, 0, C * 0.16, 0, 0, len);
    gr.addColorStop(0,    'rgba(255,252,255,' + alpha + ')');
    gr.addColorStop(0.32, 'rgba(255,228,246,' + (alpha * 0.50).toFixed(3) + ')');
    gr.addColorStop(0.66, 'rgba(255,208,238,' + (alpha * 0.18).toFixed(3) + ')');
    gr.addColorStop(0.88, 'rgba(255,198,232,' + (alpha * 0.05).toFixed(3) + ')');
    gr.addColorStop(1,    'rgba(255,194,230,0)');
    g.fillStyle = gr;
    g.fill();
    g.restore();
  }
  return cv;
}
function buildRays(){
  RAYS      = makeRaySprite(10, 0.94, 0.045, 0.72);
  RAYS_WIDE = makeRaySprite(6,  0.98, 0.115, 0.38);
}

function drawSun(time){
  const r = Math.max(24, R * 0.82);

  const breath = 1 + Math.sin(time * 1.45) * 0.034;
  const floatY = Math.sin(time * 0.85) * 2.0;
  const sway   = Math.sin(time * 0.52) * 0.020;
  const rr = r * breath;

  ctx.save();
  ctx.translate(cx, cy + floatY);

  // 光的部分一律用叠加混合：颜色相加才会「发亮」，
  // 用普通覆盖模式会叠成灰扑扑的紫，看着脏。
  ctx.globalCompositeOperation = 'lighter';

  /* ---------- 1. 最外层大辉光 ---------- */
  let g = ctx.createRadialGradient(0, 0, rr * 0.45, 0, 0, rr * 8.0);
  g.addColorStop(0,    'rgba(255,150,196,.26)');
  g.addColorStop(0.13, 'rgba(255,122,174,.11)');
  g.addColorStop(0.36, 'rgba(255,166,132,.040)');
  g.addColorStop(0.68, 'rgba(255,128,96,.016)');
  g.addColorStop(1,    'rgba(255,110,80,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, rr * 8.0, 0, TAU); ctx.fill();

  /* ---------- 2. 双层光芒（反向旋转，制造层次） ---------- */
  if(RAYS_WIDE){
    const D = rr * 5.1 * (1 + Math.sin(time * 0.7) * 0.05);
    ctx.save();
    ctx.rotate(-time * 0.042 - sway);
    ctx.globalAlpha = 0.55;
    ctx.drawImage(RAYS_WIDE, -D / 2, -D / 2, D, D);
    ctx.restore();
  }
  if(RAYS){
    const D = rr * 6.7 * (1 + Math.sin(time * 0.95) * 0.055);
    ctx.save();
    ctx.rotate(time * 0.075 + sway * 1.5);
    ctx.globalAlpha = 0.9;
    ctx.drawImage(RAYS, -D / 2, -D / 2, D, D);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* ---------- 3. 贴近本体的一圈亮芯 ---------- */
  const cg = ctx.createRadialGradient(0, 0, rr * 0.78, 0, 0, rr * 1.62);
  cg.addColorStop(0,    'rgba(255,240,250,.30)');
  cg.addColorStop(0.42, 'rgba(255,196,228,.11)');
  cg.addColorStop(1,    'rgba(255,172,212,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, rr * 1.62, 0, TAU); ctx.fill();

  /* ---------- 4. 柔和扩散的光环（替代硬线圆环） ---------- */
  const ph = (time * 0.62) % 1;
  const rad = rr * (1.24 + ph * 1.55);
  const sg = ctx.createRadialGradient(0, 0, rad * 0.90, 0, 0, rad * 1.07);
  sg.addColorStop(0,   'rgba(255,202,232,0)');
  sg.addColorStop(0.5, 'rgba(255,206,234,' + (0.15 * (1 - ph)).toFixed(4) + ')');
  sg.addColorStop(1,   'rgba(255,206,234,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(0, 0, rad * 1.07, 0, TAU); ctx.fill();

  /* ---------- 5. 本体 ---------- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.rotate(sway);
  ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.clip();

  if(SUN_TAFFY && TAFFY_READY && TAFFY_CROP){
    const c = TAFFY_CROP;
    ctx.drawImage(TAFFY, c.x, c.y, c.s, c.s, -rr, -rr, rr * 2, rr * 2);

    // 边缘融进暖光，避免像贴了张方图上去
    const vt = ctx.createRadialGradient(0, 0, rr * 0.54, 0, 0, rr);
    vt.addColorStop(0,    'rgba(255,196,170,0)');
    vt.addColorStop(0.74, 'rgba(255,168,140,.07)');
    vt.addColorStop(1,    'rgba(255,138,110,.26)');
    ctx.fillStyle = vt;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.fill();
  } else {
    const pulse = 1 + Math.sin(time * 1.2) * 0.02;
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, rr * pulse);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.26, '#fff9e2');
    gr.addColorStop(0.50, '#ffeda8');
    gr.addColorStop(0.74, '#ffc555');
    gr.addColorStop(0.92, '#ff9a28');
    gr.addColorStop(1, 'rgba(255,140,40,.9)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, rr * pulse, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* ---------- 6. 呼吸的边缘高光 ---------- */
  const rimA = 0.52 + Math.sin(time * 1.45) * 0.22;
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, rr - 0.8, 0, TAU);
  ctx.strokeStyle = 'rgba(255,234,246,' + rimA.toFixed(3) + ')';
  ctx.lineWidth = 1.4;
  ctx.shadowColor = 'rgba(255,140,198,.95)';
  ctx.shadowBlur = 13;
  ctx.stroke();
  ctx.restore();

  /* ---------- 7. 环绕星点 ---------- */
  ctx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < 10; i++){
    const a = i * 2.3999 + time * 0.20;
    const d = rr * (1.5 + ((i * 37) % 11) / 11 * 1.5);
    const tw = 0.26 + 0.74 * Math.abs(Math.sin(time * 1.9 + i * 1.87));
    ctx.globalAlpha = tw * 0.8;
    ctx.fillStyle = '#fff3fa';
    ctx.beginPath();
    ctx.arc(Math.cos(a) * d, Math.sin(a) * d * 0.92, 1.1 + tw * 1.3, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
}

/* =========================================================
   轨道
   ========================================================= */
function onOrbit(th){
  return {
    x: cx + scale * Math.cos(th),
    y: cy - scale * sinEl * Math.sin(th),
    depth: Math.sin(th) * cosEl
  };
}

function drawOrbit(time){
  const steps = 240;
  for(let i = 0; i < steps; i++){
    const a0 = i / steps * TAU, a1 = (i + 1) / steps * TAU;
    const p0 = onOrbit(a0), p1 = onOrbit(a1);
    const near = (1 - (Math.sin((a0 + a1) / 2) * cosEl + 1) / 2);
    const alpha = 0.075 + near * 0.20;
    ctx.strokeStyle = 'rgba(150,205,255,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 1 + near * 0.5;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }

  // 地球走过的尾迹
  const trail = 46;
  for(let i = 0; i < trail; i++){
    const a0 = theta - (i + 1) * 0.012, a1 = theta - i * 0.012;
    const p0 = onOrbit(a0), p1 = onOrbit(a1);
    const k = 1 - i / trail;
    ctx.strokeStyle = 'rgba(127,208,255,' + (k * k * 0.55).toFixed(3) + ')';
    ctx.lineWidth = 1 + k * 2.4;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }
}

/* =========================================================
   节气标记
   ========================================================= */
const MARKERS = [
  { th: Math.PI / 2,      name: '春分', date: '3.20' },
  { th: Math.PI,          name: '夏至', date: '6.21' },
  { th: Math.PI * 1.5,    name: '秋分', date: '9.23' },
  { th: 0,                name: '冬至', date: '12.21' }
];

function drawMarkers(){
  const cur = ((theta % TAU) + TAU) % TAU;
  MARKERS.forEach(m => {
    const p = onOrbit(m.th);
    let dx = p.x - cx, dy = p.y - cy;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;

    let diff = Math.abs(cur - ((m.th % TAU) + TAU) % TAU);
    if(diff > Math.PI) diff = TAU - diff;
    const active = diff < 0.30;

    // 点
    ctx.fillStyle = active ? 'rgba(255,199,95,.95)' : 'rgba(170,205,240,.5)';
    ctx.beginPath(); ctx.arc(p.x, p.y, active ? 3.6 : 2.4, 0, TAU); ctx.fill();
    if(active){
      ctx.strokeStyle = 'rgba(255,199,95,.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, TAU); ctx.stroke();
    }

    m._p = p; m._d = [dx, dy]; m._active = active;
  });
}

// 文字单独绘制（在地球之后），地球靠近时自动外推避免被遮挡
function drawMarkerLabels(){
  MARKERS.forEach(m => {
    const p = m._p, dx = m._d[0], dy = m._d[1];
    let near = Math.abs(((m.th - theta) % TAU + TAU) % TAU);
    if(near > Math.PI) near = TAU - near;
    const occl = Math.max(0, 1 - near / 0.9);
    const off = 30 + (R + 16 - 30) * Math.pow(occl, 1.4);

    const tx = p.x + dx * off, ty = p.y + dy * off;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(2,5,12,.9)'; ctx.shadowBlur = 8;

    ctx.font = m._active ? '600 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif'
                         : '400 12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = m._active ? 'rgba(255,214,140,.98)' : 'rgba(160,182,210,.75)';
    ctx.fillText(m.name, tx, ty);

    ctx.font = '400 9px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = m._active ? 'rgba(255,199,95,.65)' : 'rgba(140,165,195,.42)';
    ctx.fillText(m.date, tx, ty + 15);
    ctx.shadowBlur = 0;
  });
}

/* =========================================================
   阳光方向箭头
   ========================================================= */
function drawRays(ex, ey, Lx, Ly, Lz){
  // 屏幕空间：地球 → 太阳 的方向（阳光从太阳射向地球）
  let sx = Lx, sy = Lz * sinEl - Ly * cosEl;
  const l = Math.hypot(sx, sy) || 1;
  sx /= l; sy /= l;
  const px = -sy, py = sx;   // 垂直方向

  const start = R * 3.1, end = R * 1.16;
  for(let k = -2; k <= 2; k++){
    const o = k * R * 0.62;
    const x0 = ex + sx * start + px * o, y0 = ey + sy * start + py * o;
    const x1 = ex + sx * end   + px * o, y1 = ey + sy * end   + py * o;

    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, 'rgba(255,205,120,0)');
    g.addColorStop(0.55, 'rgba(255,205,120,.20)');
    g.addColorStop(1, 'rgba(255,225,160,.42)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();

    // 箭头
    const ang = Math.atan2(y1 - y0, x1 - x0);
    ctx.strokeStyle = 'rgba(255,220,150,.55)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - Math.cos(ang - 0.42) * 5.5, y1 - Math.sin(ang - 0.42) * 5.5);
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - Math.cos(ang + 0.42) * 5.5, y1 - Math.sin(ang + 0.42) * 5.5);
    ctx.stroke();
  }
}

/* =========================================================
   地球（大气 + 球体 + 地轴）
   ========================================================= */
function drawEarth(time, Lx, Ly, Lz){
  const p = onOrbit(theta);
  const ex = p.x, ey = p.y;

  // 大气外辉光
  let g = ctx.createRadialGradient(ex, ey, R * 0.88, ex, ey, R * 2.3);
  g.addColorStop(0, 'rgba(90,170,255,.20)');
  g.addColorStop(0.28, 'rgba(90,170,255,.10)');
  g.addColorStop(1, 'rgba(90,170,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(ex, ey, R * 2.3, 0, TAU); ctx.fill();

  // 球体
  renderGlobe(ex, ey, Lx, Ly, Lz, spin / TAU);

  // 边缘细环
  ctx.strokeStyle = 'rgba(150,215,255,.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(ex, ey, R - 0.4, 0, TAU); ctx.stroke();

  // 地轴
  const axX = AXIS[0], axY = -(AXIS[1] * cosEl - AXIS[2] * sinEl);
  const al = Math.hypot(axX, axY) || 1;
  const dx = axX / al, dy = axY / al;
  const ext = R * 1.52;

  ctx.save();
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = 'rgba(255,199,95,.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ex - dx * ext, ey - dy * ext);
  ctx.lineTo(ex + dx * ext, ey + dy * ext);
  ctx.stroke();
  ctx.restore();

  // 北极点
  const nx2 = ex + dx * ext, ny2 = ey + dy * ext;
  ctx.fillStyle = 'rgba(255,214,140,.95)';
  ctx.beginPath(); ctx.arc(nx2, ny2, 2.4, 0, TAU); ctx.fill();
  ctx.font = '600 9.5px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(255,199,95,.75)';
  ctx.fillText('N', nx2 + dx * 10, ny2 + dy * 10 - 2);

  return { ex, ey };
}

/* =========================================================
   主循环
   ========================================================= */
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const time = now / 1000;

  if(tween){
    tween.t += dt;
    let k = Math.min(1, tween.t / tween.dur);
    k = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    theta = tween.from + tween.delta * k;
    if(tween.t >= tween.dur) tween = null;
  } else if(playing){
    theta += dt * speed * (TAU / ORBIT_SEC);
    spin  += dt * speed * (TAU * SPINS_PER_ORBIT / ORBIT_SEC);
  }

  const Lx = -Math.cos(theta), Ly = 0, Lz = Math.sin(theta);

  drawSky(time);
  drawSun(time);
  drawOrbit(time);
  drawMarkers();

  const cur = onOrbit(theta);
  drawRays(cur.x, cur.y, Lx, Ly, Lz);
  drawEarth(time, Lx, Ly, Lz);
  drawMarkerLabels();

  if(now - hudAt > 70){ hudAt = now; updateHUD(); }

  requestAnimationFrame(frame);
}

/* =========================================================
   HUD
   ========================================================= */
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
function dateFromDay(doy){
  let d = ((doy % 365) + 365) % 365;
  let m = 0;
  while(d >= MONTH_DAYS[m]){ d -= MONTH_DAYS[m]; m++; }
  return (m + 1) + '月' + (Math.floor(d) + 1) + '日';
}

function seasonOf(th){
  const a = ((th % TAU) + TAU) % TAU / DEG;
  if(a < 90)  return 0;   // 冬
  if(a < 180) return 1;   // 春
  if(a < 270) return 2;   // 夏
  return 3;               // 秋
}
const SEASON_CN = ['冬季','春季','夏季','秋季'];
const SEASON_S  = ['夏季','秋季','冬季','春季'];

function dayLength(latDeg, dec){
  const phi = latDeg * DEG;
  const cosH = -Math.tan(phi) * Math.tan(dec);
  if(cosH <= -1) return 24;
  if(cosH >= 1) return 0;
  return 24 * Math.acos(cosH) / Math.PI;
}

const CH = { w: 240, h: 74, dot: null };

const el = {
  date: document.getElementById('dateTxt'),
  tag: document.getElementById('seasonTag'),
  south: document.getElementById('southSeason'),
  decl: document.getElementById('declTxt'),
  prog: document.getElementById('progTxt'),
  dot: document.getElementById('declDot'),
  hours: document.getElementById('hoursTxt'),
  latLabel: document.getElementById('latLabel'),
  latVal: document.getElementById('latVal')
};

function updateHUD(){
  const th = ((theta % TAU) + TAU) % TAU;
  const doy = th / TAU * 365.2422 + 354;
  const dec = Math.asin(-Math.sin(TILT) * Math.cos(th));
  const decDeg = dec / DEG;
  const si = seasonOf(th);

  el.date.textContent = dateFromDay(doy);
  el.tag.textContent = '北半球 ' + SEASON_CN[si];
  el.south.textContent = SEASON_S[si];

  const ad = Math.abs(decDeg);
  if(ad < 0.4) el.decl.textContent = '赤道 0°';
  else el.decl.textContent = (decDeg > 0 ? '北纬 ' : '南纬 ') + ad.toFixed(1) + '°';

  el.prog.textContent = Math.sin(th) > 0 ? '北移 ↑' : '南移 ↓';
  el.dot.style.left = (50 + decDeg / 23.44 * 50).toFixed(2) + '%';

  // 昼长
  const hrs = dayLength(latView, dec);
  let hh, mm;
  if(hrs >= 24){ hh = 24; mm = 0; }
  else if(hrs <= 0){ hh = 0; mm = 0; }
  else { hh = Math.floor(hrs); mm = Math.round((hrs - hh) * 60); if(mm === 60){ mm = 0; hh++; } }
  const label = hrs >= 24 ? '极昼' : hrs <= 0 ? '极夜' :
    (hh + 'h' + String(mm).padStart(2, '0') + 'm');
  el.hours.textContent = label;

  // 曲线上的点
  if(CH.dot){
    const x = Math.min(1, Math.max(0, (doy % 365.2422) / 365.2422)) * CH.w;
    const y = CH.h - hrs / 24 * CH.h;
    CH.dot.setAttribute('cx', x.toFixed(1));
    CH.dot.setAttribute('cy', Math.max(3, Math.min(CH.h - 3, y)).toFixed(1));
  }
}

function buildChart(){
  const svg = document.getElementById('chartSvg');
  if(!svg) return;
  const box = svg.getBoundingClientRect();
  const W_ = Math.max(120, Math.round(box.width || 240));
  const Hh = Math.max(28, Math.round(box.height || 74));
  CH.w = W_; CH.h = Hh;
  svg.setAttribute('viewBox', '0 0 ' + W_ + ' ' + Hh);

  let d = '', area = 'M0,' + Hh + ' ';
  for(let day = 0; day <= 365; day += 3){
    const th = (day - 354) / 365.2422 * TAU;
    const dec = Math.asin(-Math.sin(TILT) * Math.cos(th));
    const hrs = dayLength(latView, dec);
    const x = day / 365 * W_;
    const y = Hh - hrs / 24 * Hh;
    d += (day === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    area += 'L' + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }
  area += 'L' + W_ + ',' + Hh + ' Z';

  const DAY_OF = [0,31,59,90,120,151,181,212,243,273,304,334];
  let labels = '';
  [1,4,7,10].forEach(m => {
    const x = DAY_OF[m-1] / 365 * W_;
    labels += '<text x=\'' + x.toFixed(1) + '\' y=\'' + (Hh - 1) + '\' font-size=\'7\' fill=\'rgba(141,156,181,.7)\'>' + m + '月</text>';
  });
  labels += '<text x=\'' + (W_ - 1) + '\' y=\'' + (Hh - 1) + '\' text-anchor=\'end\' font-size=\'7\' fill=\'rgba(141,156,181,.7)\'>12月</text>';

  svg.innerHTML =
    '<defs><linearGradient id=\'fillGrad\' x1=\'0\' y1=\'0\' x2=\'0\' y2=\'1\'>' +
      '<stop offset=\'0%\' stop-color=\'rgba(255,199,95,.40)\'/>' +
      '<stop offset=\'100%\' stop-color=\'rgba(255,199,95,0)\'/>' +
    '</linearGradient></defs>' +
    '<line x1=\'0\' y1=\'' + (Hh/2) + '\' x2=\'' + W_ + '\' y2=\'' + (Hh/2) + '\' stroke=\'rgba(255,255,255,.14)\' stroke-dasharray=\'3 4\'/>' +
    '<path d=\'' + area + '\' fill=\'url(#fillGrad)\'/>' +
    '<path d=\'' + d + '\' fill=\'none\' stroke=\'#ffc75f\' stroke-width=\'1.6\' stroke-linejoin=\'round\'/>' +
    labels +
    '<circle id=\'dotMark\' r=\'3.4\' fill=\'#fff\' stroke=\'#ffc75f\' stroke-width=\'2\'/>';

  CH.dot = svg.querySelector('#dotMark');
  el.latLabel.textContent = (latView >= 0 ? '北纬 ' : '南纬 ') + Math.abs(latView) + '°';
  el.latVal.textContent = Math.abs(latView) + '°' + (latView >= 0 ? 'N' : 'S');
}

/* =========================================================
   交互
   ========================================================= */
const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '❚❚' : '▶';
  playBtn.classList.toggle('on', !playing);
});

document.getElementById('speed').addEventListener('input', e => {
  speed = parseFloat(e.target.value);
  document.getElementById('speedVal').textContent = speed.toFixed(1) + '×';
});

document.getElementById('latSlider').addEventListener('input', e => {
  latView = parseInt(e.target.value, 10);
  buildChart();
  updateHUD();
});

document.querySelectorAll('[data-th]').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = parseInt(btn.dataset.th, 10) * Math.PI / 2;
    const cur = theta;
    let delta = ((target - cur) % TAU + TAU) % TAU;
    if(delta > Math.PI) delta -= TAU;
    tween = { from: cur, delta, t: 0, dur: 0.75 };
  });
});

window.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
});

/* =========================================================
   尺寸
   ========================================================= */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 窄屏用更高的视角，让椭圆不那么扁，撑满画面
  EL = W < 820 ? 42 * DEG : 30 * DEG;
  sinEl = Math.sin(EL); cosEl = Math.cos(EL);

  R = Math.max(30, Math.min(72, Math.min(W, H) * 0.098));
  if(W < 820) R = Math.min(R, W * 0.115);

  const marginX = W < 820 ? 16 : 130;
  const marginY = W < 820 ? 30 : (H < 700 ? 40 : 105);
  scale = Math.min(
    (W / 2 - marginX - R * 1.15),
    (H / 2 - marginY - R * 1.25) / sinEl
  );
  scale = Math.max(scale, 70);

  cx = W / 2;
  cy = H * (W < 820 ? 0.495 : 0.505);

  buildBG();
  buildStars();
  buildGlobe();
  if(el.latLabel) buildChart();
}

let rzTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(resize, 120);
});

/* =========================================================
   启动
   ========================================================= */
initTaffy();
buildRays();
buildTexture();
resize();
buildChart();
updateHUD();
requestAnimationFrame(frame);

})();
</script>
